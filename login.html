<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicio de Sesión - AURUM Centro de Imagen Oncológica y Diagnóstico">
  <title>AURUM | Inicio de Sesión</title>
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./assets/images/logos/logo01_round.png">

  <!-- Usamos los estilos base del admin para las variables de colores y fuentes -->
  <link rel="stylesheet" href="./src/admin.css">
  <link rel="stylesheet" href="./src/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img class="login-logo" src="./assets/images/logos/logo-principal.svg" alt="Aurum Administrador">
        <h2>Bienvenido de Nuevo</h2>
        <p>Inicia sesión para acceder al panel de administración</p>
      </div>
      
      <form id="login-form">
        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="email" name="email" required placeholder="ejemplo@correo.com" style="padding-left: 3rem;">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="password" name="password" required placeholder="••••••••" style="padding-left: 3rem; padding-right: 2.5rem;">
            <button type="button" class="toggle-password" id="toggle-password" aria-label="Mostrar contraseña">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <div id="error-message" class="error-message" style="display: none;">
          Credenciales incorrectas
        </div>

        <button type="submit" class="btn-primary login-btn">
          Ingresar
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>

        <div style="text-align: center; margin-top: 1rem;">
          <a href="#" id="show-forgot-password" style="color: var(--color-primary-light, #7c317f); text-decoration: none; font-size: 0.9rem; font-weight: 600;">¿Olvidaste tu contraseña?</a>
        </div>
      </form>

      <!-- Formulario de Recuperar Contraseña (Oculto por defecto) -->
      <form id="forgot-password-form" style="display: none;">
        <div class="form-group">
          <label for="forgot-email">Correo Electrónico</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
            <input type="email" id="forgot-email" name="forgot-email" required placeholder="ejemplo@correo.com">
          </div>
        </div>

        <div id="forgot-message" class="error-message" style="display: none; background-color: rgba(74, 21, 75, 0.1); color: var(--color-primary, #4a154b);">
          Enlace enviado
        </div>

        <button type="submit" class="btn-primary login-btn forgot-btn">
          Enviar enlace
        </button>

        <div style="text-align: center; margin-top: 1rem;">
          <a href="#" id="show-login" style="color: var(--color-text-muted, #718096); text-decoration: none; font-size: 0.9rem; font-weight: 600;">Volver al inicio de sesión</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./src/login.js"></script>
</body>
</html>
