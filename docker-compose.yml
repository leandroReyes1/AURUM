version: "3.9"

services:
  proxy:
    image: nginx:alpine
    container_name: aurum_proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: aurum_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-lean}
      MYSQL_DATABASE: clinicaaurum
    volumes:
      - db_data:/var/lib/mysql

  web:
    build: .
    container_name: aurum_frontend
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped

  api:
    build: ../API
    container_name: aurum_backend
    env_file:
      - ../API/.env
    environment:
      - DATABASE_URL=mysql://root:lean@db:3306/clinicaaurum
    depends_on:
      - db
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: aurum_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  db_data:
