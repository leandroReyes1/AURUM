<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Restablecer Contraseña - AURUM Centro de Imagen Oncológica y Diagnóstico">
  <title>AURUM | Restablecer Contraseña</title>

  <link rel="stylesheet" href="./src/admin.css">
  <link rel="stylesheet" href="./src/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <img class="login-logo" src="./assets/images/logos/logo-principal.svg" alt="Aurum Administrador">
        <h2>Restablecer Contraseña</h2>
        <p>Crea una nueva contraseña para tu cuenta</p>
      </div>
      
      <form id="reset-password-form">
        <div class="form-group">
          <label for="new-password">Nueva Contraseña</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="new-password" name="new-password" required placeholder="Min. 6 caracteres" minlength="6">
          </div>
        </div>

        <div class="form-group">
          <label for="confirm-password">Confirmar Contraseña</label>
          <div class="input-wrapper">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input type="password" id="confirm-password" name="confirm-password" required placeholder="Repite la contraseña">
          </div>
        </div>

        <div id="reset-message" class="error-message" style="display: none;">
          Mensaje
        </div>

        <button type="submit" class="btn-primary login-btn">
          Guardar Contraseña
        </button>

        <div style="text-align: center; margin-top: 1rem;">
          <a href="./login.html" style="color: var(--color-text-muted, #718096); text-decoration: none; font-size: 0.9rem; font-weight: 600;">Ir al inicio de sesión</a>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="./src/reset-password.js"></script>
</body>
</html>
