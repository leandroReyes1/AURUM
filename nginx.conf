# ========================================================
# SERVIDOR PARA SUBDOMINIO DE ADMINISTRACIÓN
# ========================================================
server {
    listen 80;
    listen 443 ssl;
    server_name admin.radioonco.com.mx;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Redirigir HTTP a HTTPS
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # Backend de Autenticación
    location /api/auth/ {
        proxy_pass http://api:5000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Backend de Citas
    location /api/ {
        proxy_pass http://web:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Redirigir la raíz (/) directamente al panel de administrador
    location = / {
        proxy_pass http://web:4000/admin.html;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Servir todos los demás archivos estáticos (JS, CSS, Imágenes, login.html)
    location / {
        proxy_pass http://web:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# ========================================================
# SERVIDOR PARA EL SITIO PRINCIPAL (PÚBLICO)
# ========================================================
server {
    listen 80;
    listen 443 ssl;
    # Acepta radioonco.com.mx, www... y cualquier otra petición por defecto
    server_name radioonco.com.mx www.radioonco.com.mx _;

    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    # Redirigir HTTP a HTTPS
    if ($scheme = http) {
        return 301 https://$host$request_uri;
    }

    # Backend de Autenticación
    location /api/auth/ {
        proxy_pass http://api:5000/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Resto del tráfico (Frontend e index.html)
    location / {
        proxy_pass http://web:4000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
